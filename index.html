<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b19">
  <meta name="description" content="A local-view, retro seafaring adventure inspired by Uncharted Waters: New Horizons.">
  <title>Far Horizons</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="console" aria-label="Far Horizons game">
    <div class="screen" id="screen">
      <canvas id="chart" width="512" height="384" tabindex="0"></canvas>
      <nav class="command-strip play-controls" id="command-strip" aria-label="Game navigation">
        <button id="commands-button">Menu</button><button id="chart-button">Chart</button><button id="fleet-button">Ships</button><button id="cargo-button">Cargo</button><button id="journal-button">Journal</button><button id="sail-data-button">Voyage</button>
      </nav>
      <div class="sailing-controls play-controls" role="group" aria-label="Sailing time">
        <button id="pause-button" aria-label="Resume sailing" aria-pressed="true">▶</button><button id="speed-button" aria-label="Travel speed 4X. Change to 16X.">&gt;&gt;</button>
      </div>
      <dialog id="modal" aria-labelledby="menu-title"><div id="modal-content"></div></dialog>
    </div>
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  </main>
  <input type="file" id="import-file" accept="application/json" hidden>
  <script type="module" src="app.js"></script>
</body>
</html>
